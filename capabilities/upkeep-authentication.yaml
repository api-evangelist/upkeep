naftiko: 1.0.0-alpha2
info:
  label: UpKeep API — Authentication
  description: 'UpKeep API — Authentication. 2 operations. Lead operation: Create Session. Self-contained Naftiko capability
    covering one Upkeep business surface.'
  tags:
  - Upkeep
  - Authentication
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    UPKEEP_API_KEY: UPKEEP_API_KEY
capability:
  consumes:
  - type: http
    namespace: upkeep-authentication
    baseUri: https://api.onupkeep.com/api/v2
    description: UpKeep API — Authentication business capability. Self-contained, no shared references.
    resources:
    - name: auth
      path: /auth
      operations:
      - name: createsession
        method: POST
        description: Create Session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletesession
        method: DELETE
        description: Delete Session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: session-token
      value: '{{env.UPKEEP_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: upkeep-authentication-rest
    port: 8080
    description: REST adapter for UpKeep API — Authentication. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/auth
      name: auth
      description: REST surface for auth.
      operations:
      - method: POST
        name: createsession
        description: Create Session
        call: upkeep-authentication.createsession
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletesession
        description: Delete Session
        call: upkeep-authentication.deletesession
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: upkeep-authentication-mcp
    port: 9090
    transport: http
    description: MCP adapter for UpKeep API — Authentication. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: create-session
      description: Create Session
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: upkeep-authentication.createsession
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-session
      description: Delete Session
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: upkeep-authentication.deletesession
      outputParameters:
      - type: object
        mapping: $.
