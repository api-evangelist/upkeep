  exposes:
  - type: rest
    namespace: upkeep-locations-rest
    port: 8080
    description: REST adapter for UpKeep API — Locations. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/locations
      name: locations
      description: REST surface for locations.
      operations:
      - method: GET
        name: listlocations
        description: List Locations
        call: upkeep-locations.listlocations
        with:
          page: rest.page
          limit: rest.limit
          parentId: rest.parentId
        outputParameters:
        - type: object
